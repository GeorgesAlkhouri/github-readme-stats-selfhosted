---
name: CI
on:
  push:
    branches:
      - main
      - "feat/*"
  pull_request:
    branches:
      - main
      - "feat/*"
    paths:
      - "Dockerfile"
      - ".github/workflows/**"
jobs:
  lint-build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build image (no push)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: local/github-readme-stats:test

      - name: Smoke test container
        run: |
          docker run -d --rm --name grs -p 9000:9000 \
            -e PAT_1=$GH_README_STATS_PAT \
            local/github-readme-stats:test
          sleep 5
          curl -f "http://localhost:9000/api?username=octocat" -o /tmp/card.svg
          file /tmp/card.svg
          grep -q "<svg" /tmp/card.svg
          docker logs grs
          docker stop grs
        env:
          GH_README_STATS_PAT: ${{ secrets.GH_README_STATS_PAT }}
